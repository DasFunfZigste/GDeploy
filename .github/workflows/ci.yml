name: Test and container smoke check
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: pytest -q
      - run: ruff check .
      - run: docker build -t gdeploy:test .
      - name: Verify image setup, Compose and Docker CLI
        run: python scripts/smoke_image.py gdeploy:test
