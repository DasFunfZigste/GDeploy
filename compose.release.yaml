name: gdeploy

services:
  gdeploy:
    image: ${GDEPLOY_IMAGE:-ghcr.io/dasfunfzigste/gdeploy:0.15.0}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      GDEPLOY_COOKIE_SECURE: ${GDEPLOY_COOKIE_SECURE:-false}
    ports:
      - "${GDEPLOY_BIND_IP:-0.0.0.0}:${GDEPLOY_PORT:-8000}:8000"
    volumes:
      # Persistent ISOs and build workspace use available backing-filesystem
      # space. No application-level capacity quota is imposed on this volume.
      - gdeploy-data:/data
      - ./media:/media:ro
    read_only: true
    tmpfs:
      # Small runtime scratch only; ISO builder subprocesses use /data/artifacts.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  gdeploy-data:
    name: ${GDEPLOY_DATA_VOLUME:-gdeploy-data}
