[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gdeploy"
version = "0.3.1"
description = "Deploy operating systems and application VMs to standalone VMware ESXi"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "cryptography==50.0.1",
  "paramiko==5.0.0", "pyvmomi==9.1.1.0", "requests==2.34.2", "PyYAML==6.0.3", "passlib==1.7.4"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
include = ["gdeploy*"]

[tool.setuptools.package-data]
gdeploy = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
